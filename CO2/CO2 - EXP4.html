<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMATS Student Performance Analytics Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1626;
    --panel:#121F35;
    --panel-2:#17273F;
    --field:#0E1C30;
    --line: rgba(237,239,244,0.10);
    --line-strong: rgba(237,239,244,0.18);
    --text:#EDEFF4;
    --muted:#8CA0BD;
    --teal:#2DD9C4;
    --teal-dim: rgba(45,217,196,0.14);
    --amber:#F2B84B;
    --amber-dim: rgba(242,184,75,0.14);
    --red:#F0716B;
    --red-dim: rgba(240,113,107,0.12);
    --green:#3FE07C;
    --green-dim: rgba(63,224,124,0.12);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% -10%, rgba(45,217,196,0.10), transparent 42%),
      radial-gradient(circle at 92% 6%, rgba(242,184,75,0.07), transparent 40%),
      var(--ink);
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.55;
  }
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; margin:0;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 5%;
    background:rgba(11,22,38,0.75);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(145deg, var(--teal), #1B8F80);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; color:#04241F; font-size:14px;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text b{font-family:'Space Grotesk'; font-size:15px;}
  .brand-text span{font-size:11px; color:var(--muted); letter-spacing:.4px; text-transform:uppercase;}
  .updated{font-size:12.5px; color:var(--muted); font-family:'JetBrains Mono';}

  .wrap{max-width:1080px; margin:0 auto; padding:32px 5% 60px;}

  /* ---------- Stat cards ---------- */
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:22px;}
  .stat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px;
  }
  .stat-card span.lbl{font-family:'JetBrains Mono'; font-size:11px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase;}
  .stat-card .val{font-size:30px; font-weight:600; margin-top:8px; font-family:'Space Grotesk';}
  .stat-card.status .val{display:flex; align-items:center; gap:8px;}
  .pill{font-size:13px; padding:3px 12px; border-radius:20px; font-weight:600;}
  .pill.pass{background:var(--green-dim); color:var(--green);}
  .pill.fail{background:var(--red-dim); color:var(--red);}

  /* ---------- Main grid ---------- */
  .grid{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 24px; margin-bottom:18px;
  }
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .panel-head h2{font-size:16px; font-weight:600;}
  .panel-head .tag{font-family:'JetBrains Mono'; font-size:11px; color:var(--muted);}

  /* student details */
  .sd-row{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .avatar{
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(160deg,#22405A,#0F2135); border:2px solid var(--teal);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:18px; color:var(--teal);
  }
  .sd-name{font-size:16px; font-weight:600;}
  .sd-reg{font-family:'JetBrains Mono'; font-size:12px; color:var(--teal);}
  .sd-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .sd-field span{display:block; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:3px;}
  .sd-field b{font-size:13.5px; font-weight:500;}

  /* subject table */
  table{width:100%; border-collapse:collapse;}
  th{
    font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted);
    text-align:left; padding:0 8px 10px; font-weight:500;
  }
  td{padding:10px 8px; border-top:1px solid var(--line); font-size:14px;}
  tr:hover td{background:var(--panel-2);}
  .grade-badge{
    font-family:'JetBrains Mono'; font-size:11.5px; font-weight:700;
    padding:3px 9px; border-radius:8px; display:inline-block;
  }
  .g-Aplus{background:var(--teal-dim); color:var(--teal);}
  .g-A{background:var(--teal-dim); color:var(--teal);}
  .g-Bplus{background:var(--amber-dim); color:var(--amber);}
  .g-B{background:var(--amber-dim); color:var(--amber);}
  .g-C{background:rgba(237,239,244,0.10); color:var(--muted);}
  .g-F{background:var(--red-dim); color:var(--red);}

  /* chart bars */
  .bar-chart{display:flex; align-items:flex-end; gap:14px; height:180px; padding-top:20px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .bar-val{font-family:'JetBrains Mono'; font-size:11.5px; color:var(--muted); margin-bottom:6px;}
  .bar{width:100%; max-width:34px; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg, var(--teal), #1B8F80); transition:height 1s cubic-bezier(.2,.8,.2,1); height:0;}
  .bar.low{background:linear-gradient(180deg, var(--amber), #a06d1c);}
  .bar-label{font-size:11.5px; color:var(--muted); margin-top:8px; text-align:center;}

  /* analytics mini cards */
  .mini-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media (max-width:520px){ .mini-grid{grid-template-columns:repeat(2,1fr);} }
  .mini-card{background:var(--field); border:1px solid var(--line); border-radius:12px; padding:14px 12px; text-align:center;}
  .mini-card span{display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin-bottom:6px;}
  .mini-card b{font-size:19px; font-family:'Space Grotesk'; font-weight:600;}

  /* performance summary */
  .summary{
    background:linear-gradient(160deg, var(--teal-dim), rgba(23,39,63,0.4));
    border:1px solid rgba(45,217,196,0.35); border-radius:var(--radius);
    padding:22px 24px; display:flex; gap:16px; align-items:flex-start;
  }
  .summary .star{
    width:40px; height:40px; border-radius:10px; background:var(--teal); color:#04241F;
    display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;
  }
  .summary h3{font-size:16px; margin-bottom:8px;}
  .summary p{margin:0 0 4px; font-size:14px; color:var(--text); opacity:0.9;}
  .summary p.muted{color:var(--muted); font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">SI</div>
    <div class="brand-text">
      <b>SIMATS Analytics</b>
      <span>Student Performance Dashboard</span>
    </div>
  </div>
  <div class="updated" id="clock">Loading…</div>
</header>

<div class="wrap">

  <div class="stat-row">
    <div class="stat-card">
      <span class="lbl">Total marks</span>
      <div class="val" id="statTotal">—</div>
    </div>
    <div class="stat-card">
      <span class="lbl">Average</span>
      <div class="val" id="statAvg">—</div>
    </div>
    <div class="stat-card status">
      <span class="lbl">Status</span>
      <div class="val"><span class="pill" id="statStatus">—</span></div>
    </div>
  </div>

  <div class="grid">
    <div>
      <div class="panel">
        <div class="panel-head"><h2>Subject marks</h2><span class="tag" id="subjectCount">—</span></div>
        <table>
          <thead>
            <tr><th>Subject</th><th>Mark</th><th>Grade</th></tr>
          </thead>
          <tbody id="marksBody"></tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Marks by subject</h2><span class="tag">out of 100</span></div>
        <div class="bar-chart" id="barChart"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <div class="panel-head"><h2>Student details</h2></div>
        <div class="sd-row">
          <div class="avatar" id="sdAvatar">—</div>
          <div>
            <div class="sd-name" id="sdName">—</div>
            <div class="sd-reg" id="sdReg">—</div>
          </div>
        </div>
        <div class="sd-grid">
          <div class="sd-field"><span>Department</span><b id="sdDept">—</b></div>
          <div class="sd-field"><span>Subjects passed</span><b id="sdPassed">—</b></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Analytics</h2></div>
        <div class="mini-grid">
          <div class="mini-card"><span>Highest</span><b id="statHigh">—</b></div>
          <div class="mini-card"><span>Lowest</span><b id="statLow">—</b></div>
          <div class="mini-card"><span>Passed</span><b id="statPassed">—</b></div>
          <div class="mini-card"><span>Grade</span><b id="statGrade">—</b></div>
        </div>
      </div>
    </div>
  </div>

  <div class="summary">
    <div class="star">&#127775;</div>
    <div>
      <h3 id="summaryHeadline">—</h3>
      <p id="summaryLine1">—</p>
      <p id="summaryLine2">—</p>
      <p class="muted" id="summaryLine3">—</p>
    </div>
  </div>

</div>

<script>
  /* ---------- Student record & subject data ---------- */
  const student = {
    name: 'Kaviya Muthukrishnan',
    regNo: '24IT101',
    department: 'Information Technology'
  };

  const subjects = [
    { name: 'Web Technology', mark: 92 },
    { name: 'Java',           mark: 85 },
    { name: 'DBMS',           mark: 88 },
    { name: 'Networks',       mark: 78 },
    { name: 'Python',         mark: 95 }
  ];

  const PASS_MARK = 50;

  /* ---------- Functions ---------- */
  function getGrade(mark){
    if(mark >= 90) return 'A+';
    if(mark >= 80) return 'A';
    if(mark >= 70) return 'B+';
    if(mark >= 60) return 'B';
    if(mark >= PASS_MARK) return 'C';
    return 'F';
  }

  function gradeClass(grade){
    return 'g-' + grade.replace('+', 'plus');
  }

  function overallGrade(average){
    if(average >= 90) return 'A+';
    if(average >= 80) return 'A';
    if(average >= 70) return 'B+';
    if(average >= 60) return 'B';
    if(average >= PASS_MARK) return 'C';
    return 'F';
  }

  function analyse(list){
    const marks = list.map(s => s.mark);
    let total = 0;
    let passedCount = 0;

    for(let i = 0; i < list.length; i++){
      total += list[i].mark;
      if(list[i].mark >= PASS_MARK) passedCount++;
    }

    const average = total / list.length;
    const highest = Math.max(...marks);
    const lowest = Math.min(...marks);
    const highestSubject = list.find(s => s.mark === highest).name;
    const lowestSubject = list.find(s => s.mark === lowest).name;
    const overallStatus = passedCount === list.length ? 'PASS' : 'FAIL';

    return { total, average, highest, lowest, highestSubject, lowestSubject, passedCount, overallStatus };
  }

  function buildSummary(a, list){
    let headline, l1, l2, l3;

    if(a.average >= 90){
      headline = '\u{1F31F} Outstanding performance!';
    } else if(a.average >= 75){
      headline = '\u{1F31F} Excellent performance!';
    } else if(a.average >= PASS_MARK){
      headline = 'Solid effort — keep building.';
    } else {
      headline = 'Needs improvement — extra focus required.';
    }

    l1 = 'Your highest score is ' + a.highest + ' in ' + a.highestSubject + '.';
    l2 = 'Your average is ' + a.average.toFixed(1) + '%.';

    const weakest = list.reduce((min, s) => s.mark < min.mark ? s : min, list[0]);
    l3 = a.overallStatus === 'PASS'
      ? 'Keep improving ' + weakest.name + '.'
      : weakest.name + ' needs the most attention to clear the pass mark.';

    return { headline, l1, l2, l3 };
  }

  /* ---------- Render ---------- */
  const results = analyse(subjects);
  const summary = buildSummary(results, subjects);

  document.getElementById('statTotal').textContent = results.total;
  document.getElementById('statAvg').textContent = results.average.toFixed(1) + '%';

  const statusEl = document.getElementById('statStatus');
  statusEl.textContent = results.overallStatus;
  statusEl.classList.add(results.overallStatus === 'PASS' ? 'pass' : 'fail');

  document.getElementById('sdAvatar').textContent = student.name.split(' ').map(n => n[0]).join('').slice(0,2);
  document.getElementById('sdName').textContent = student.name;
  document.getElementById('sdReg').textContent = 'REG NO · ' + student.regNo;
  document.getElementById('sdDept').textContent = student.department;
  document.getElementById('sdPassed').textContent = results.passedCount + ' / ' + subjects.length;

  document.getElementById('statHigh').textContent = results.highest;
  document.getElementById('statLow').textContent = results.lowest;
  document.getElementById('statPassed').textContent = results.passedCount + '/' + subjects.length;
  document.getElementById('statGrade').textContent = overallGrade(results.average);

  document.getElementById('subjectCount').textContent = subjects.length + ' subjects';

  const marksBody = document.getElementById('marksBody');
  subjects.forEach(s => {
    const grade = getGrade(s.mark);
    const row = document.createElement('tr');
    row.innerHTML =
      '<td>' + s.name + '</td>' +
      '<td>' + s.mark + '</td>' +
      '<td><span class="grade-badge ' + gradeClass(grade) + '">' + grade + '</span></td>';
    marksBody.appendChild(row);
  });

  const barChart = document.getElementById('barChart');
  subjects.forEach(s => {
    const col = document.createElement('div');
    col.className = 'bar-col';
    col.innerHTML =
      '<div class="bar-val">' + s.mark + '</div>' +
      '<div class="bar' + (s.mark < 80 ? ' low' : '') + '" data-h="' + s.mark + '"></div>' +
      '<div class="bar-label">' + s.name + '</div>';
    barChart.appendChild(col);
  });

  requestAnimationFrame(() => {
    document.querySelectorAll('.bar').forEach(bar => {
      const h = +bar.getAttribute('data-h');
      bar.style.height = h + '%';
    });
  });

  document.getElementById('summaryHeadline').textContent = summary.headline;
  document.getElementById('summaryLine1').textContent = summary.l1;
  document.getElementById('summaryLine2').textContent = summary.l2;
  document.getElementById('summaryLine3').textContent = summary.l3;

  /* live clock */
  function updateClock(){
    const now = new Date();
    document.getElementById('clock').textContent =
      'Last updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
  }
  updateClock();
  setInterval(updateClock, 30000);
</script>

</body>
</html>
