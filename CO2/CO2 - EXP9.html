<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMATS Campus Store – Smart Billing System</title>
<style>
  :root{
    --purple:#6C3CE9;
    --pink:#FF3E9A;
    --orange:#FF8A3D;
    --teal:#1FC8C1;
    --yellow:#FFC93C;
    --blue:#2F6FED;
    --green:#2ECC71;
    --red:#FF4D5E;
    --dark:#1B1330;
    --bg:#F5F3FF;
    --card-bg:#ffffff;
    --radius:18px;
    --shadow:0 12px 30px rgba(108,60,233,0.14);
  }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI','Trebuchet MS',sans-serif; }
  body{
    background:
      radial-gradient(circle at 10% 5%, rgba(255,201,60,0.14), transparent 35%),
      radial-gradient(circle at 90% 15%, rgba(31,200,193,0.16), transparent 40%),
      var(--bg);
    color:var(--dark);
    min-height:100vh;
  }

  /* ===== TOP BAR ===== */
  .topbar{
    background:linear-gradient(90deg,var(--purple),var(--pink));
    color:#fff; padding:18px 5%;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.12);
  }
  .brand{ font-size:1.3rem; font-weight:800; display:flex; align-items:center; gap:10px; }
  .brand span{ color:var(--yellow); }
  .search-box{
    flex:1 1 260px; max-width:380px; display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.18); border-radius:30px; padding:10px 18px;
  }
  .search-box input{
    border:none; background:transparent; outline:none; color:#fff; width:100%; font-size:0.9rem;
  }
  .search-box input::placeholder{ color:rgba(255,255,255,0.75); }
  .cashier-badge{
    display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.15);
    padding:8px 16px; border-radius:30px; font-size:0.85rem; font-weight:600;
  }

  /* ===== LAYOUT ===== */
  .main-layout{
    display:grid; grid-template-columns:2fr 1fr; gap:26px;
    max-width:1300px; margin:0 auto; padding:30px 5% 60px;
  }

  /* ===== CATEGORY TABS ===== */
  .category-tabs{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  .cat-tab{
    padding:9px 20px; border-radius:30px; background:#fff; border:2px solid #ECE4FB;
    font-weight:700; font-size:0.88rem; cursor:pointer; color:var(--dark); transition:.2s;
  }
  .cat-tab.active{ background:var(--purple); color:#fff; border-color:var(--purple); }

  /* ===== PRODUCT GRID ===== */
  .product-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:20px;
  }
  .product-card{
    background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:22px 18px; text-align:center; position:relative;
    border:2px solid transparent; transition: transform .25s, border-color .25s;
  }
  .product-card:hover{ transform:translateY(-6px); border-color:var(--purple); }
  .stock-badge{
    position:absolute; top:12px; right:12px; font-size:0.68rem; font-weight:700;
    background:var(--yellow); color:var(--dark); padding:3px 10px; border-radius:20px;
  }
  .product-emoji{
    font-size:2.6rem; margin-bottom:10px;
    width:64px; height:64px; border-radius:50%; margin-left:auto; margin-right:auto;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--purple),var(--pink));
  }
  .product-card:nth-child(3n+2) .product-emoji{ background:linear-gradient(135deg,var(--teal),var(--blue)); }
  .product-card:nth-child(3n+3) .product-emoji{ background:linear-gradient(135deg,var(--orange),var(--yellow)); }
  .product-name{ font-weight:700; font-size:0.98rem; margin-bottom:4px; }
  .product-price{ color:var(--purple); font-weight:800; font-size:1.05rem; margin-bottom:14px; }
  .add-btn{
    width:100%; padding:10px; border:none; border-radius:12px; background:#F1ECFF;
    color:var(--purple); font-weight:700; cursor:pointer; font-size:0.88rem; transition:.2s;
  }
  .add-btn:hover{ background:var(--purple); color:#fff; }

  /* ===== CART / BILLING PANEL ===== */
  .cart-panel{
    background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:26px; height:fit-content; position:sticky; top:20px;
  }
  .cart-panel h2{ font-size:1.15rem; margin-bottom:6px; color:var(--purple); }
  .order-no{ font-size:0.78rem; color:#9a92ac; margin-bottom:18px; }

  .cart-items{ display:flex; flex-direction:column; gap:14px; margin-bottom:18px; max-height:260px; overflow-y:auto; }
  .cart-item{
    display:flex; align-items:center; gap:12px; background:#F8F6FF; border-radius:12px; padding:10px 12px;
  }
  .cart-item .emoji-sm{
    width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--purple),var(--pink));
    display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0;
  }
  .cart-item-info{ flex:1; }
  .cart-item-info .name{ font-weight:700; font-size:0.9rem; }
  .cart-item-info .price{ font-size:0.8rem; color:#8b83a0; }
  .qty-controls{ display:flex; align-items:center; gap:8px; }
  .qty-controls button{
    width:26px; height:26px; border-radius:50%; border:none; background:#EDE7FB; cursor:pointer;
    font-weight:800; color:var(--purple); font-size:0.9rem;
  }
  .qty-controls button:hover{ background:var(--purple); color:#fff; }
  .qty-num{ font-weight:700; min-width:16px; text-align:center; font-size:0.88rem; }
  .remove-btn{
    background:none; border:none; cursor:pointer; color:var(--red); font-size:0.95rem; margin-left:6px;
  }

  .empty-cart{ text-align:center; padding:30px 10px; color:#9a92ac; font-size:0.9rem; }
  .empty-cart div{ font-size:2.2rem; margin-bottom:8px; }

  .bill-summary{ border-top:2px dashed #EDE7FB; padding-top:16px; margin-bottom:18px; }
  .bill-row{ display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:8px; color:#5a5468; }
  .bill-row.discount span:last-child{ color:var(--green); font-weight:700; }
  .bill-row.tax span:last-child{ color:var(--orange); font-weight:700; }
  .bill-row.total{
    font-size:1.15rem; font-weight:800; color:var(--dark); border-top:2px dashed #EDE7FB;
    padding-top:12px; margin-top:6px;
  }
  .bill-row.total span:last-child{ color:var(--purple); }

  .discount-tag{
    display:inline-block; font-size:0.72rem; font-weight:700; padding:3px 10px; border-radius:20px;
    background:#E8FBF0; color:var(--green); margin-left:8px;
  }

  .generate-btn{
    width:100%; padding:14px; border:none; border-radius:30px; font-weight:800; font-size:1rem; cursor:pointer;
    background:linear-gradient(90deg,var(--purple),var(--pink)); color:#fff;
    box-shadow:0 10px 24px rgba(108,60,233,0.35);
    transition:transform .2s;
  }
  .generate-btn:hover{ transform:translateY(-3px); }
  .generate-btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }

  /* ===== BILL MODAL ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(27,19,48,0.6); display:none;
    align-items:center; justify-content:center; z-index:999; padding:20px;
  }
  .modal-overlay.active{ display:flex; }
  .bill-modal{
    background:#fff; border-radius:20px; padding:30px; max-width:380px; width:100%;
    box-shadow:0 30px 60px rgba(0,0,0,0.3); text-align:center;
  }
  .bill-modal h2{ color:var(--purple); margin-bottom:4px; }
  .bill-modal .sub{ color:#9a92ac; font-size:0.85rem; margin-bottom:20px; }
  .bill-modal .receipt-lines{ text-align:left; font-size:0.88rem; margin-bottom:16px; }
  .bill-modal .receipt-lines div{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed #eee; }
  .bill-modal .final-total{ font-size:1.3rem; font-weight:800; color:var(--dark); margin:14px 0; }
  .close-modal{
    padding:12px 30px; border:none; border-radius:30px; background:var(--purple); color:#fff;
    font-weight:700; cursor:pointer;
  }

  @media (max-width:900px){
    .main-layout{ grid-template-columns:1fr; }
    .cart-panel{ position:static; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🛍️ SIMATS <span>CAMPUS STORE</span></div>
  <div class="search-box">🔍 <input type="text" id="searchInput" placeholder="Search product..."></div>
  <div class="cashier-badge">🧑‍💼 Kaviya M. — Cashier</div>
</div>

<div class="main-layout">

  <!-- PRODUCTS -->
  <div>
    <div class="category-tabs" id="categoryTabs">
      <div class="cat-tab active" data-cat="All">All Items</div>
      <div class="cat-tab" data-cat="Apparel">👕 Apparel</div>
      <div class="cat-tab" data-cat="Accessories">🎒 Accessories</div>
      <div class="cat-tab" data-cat="Drinkware">☕ Drinkware</div>
      <div class="cat-tab" data-cat="Stationery">📓 Stationery</div>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- CART / BILLING -->
  <div class="cart-panel">
    <h2>🧾 Cart & Billing</h2>
    <div class="order-no">Order No: <strong id="orderNo">SC-1001</strong></div>

    <div class="cart-items" id="cartItems"></div>

    <div class="bill-summary">
      <div class="bill-row"><span>Total Items</span><span id="totalItemsCount">0</span></div>
      <div class="bill-row"><span>Subtotal</span><span id="subtotalVal">₹0</span></div>
      <div class="bill-row discount"><span>Discount <span id="discountTag" class="discount-tag" style="display:none;"></span></span><span id="discountVal">−₹0</span></div>
      <div class="bill-row tax"><span>Tax (5%)</span><span id="taxVal">+₹0</span></div>
      <div class="bill-row total"><span>TOTAL</span><span id="totalVal">₹0</span></div>
    </div>

    <button class="generate-btn" id="generateBillBtn" disabled>🧾 GENERATE BILL</button>
  </div>
</div>

<!-- BILL RECEIPT MODAL -->
<div class="modal-overlay" id="billModal">
  <div class="bill-modal">
    <h2>✅ Bill Generated!</h2>
    <div class="sub">SIMATS Campus Store — Order <span id="modalOrderNo"></span></div>
    <div class="receipt-lines" id="receiptLines"></div>
    <div class="final-total">Total Paid: <span id="modalTotal"></span></div>
    <button class="close-modal" id="closeModalBtn">New Order</button>
  </div>
</div>

<script>
  // ===== PRODUCT DATA =====
  const products = [
    { id: 1, name: "College Bag", price: 799, emoji: "🎒", category: "Accessories", stock: 32 },
    { id: 2, name: "SIMATS T-Shirt", price: 499, emoji: "👕", category: "Apparel", stock: 58 },
    { id: 3, name: "Coffee Mug", price: 249, emoji: "☕", category: "Drinkware", stock: 71 },
    { id: 4, name: "Hoodie", price: 999, emoji: "🧥", category: "Apparel", stock: 24 },
    { id: 5, name: "Water Bottle", price: 299, emoji: "🍶", category: "Drinkware", stock: 45 },
    { id: 6, name: "Notebook Set", price: 199, emoji: "📓", category: "Stationery", stock: 88 },
    { id: 7, name: "Cap", price: 349, emoji: "🧢", category: "Apparel", stock: 40 },
    { id: 8, name: "ID Card Holder", price: 149, emoji: "🪪", category: "Accessories", stock: 60 },
    { id: 9, name: "Pen Set", price: 99, emoji: "🖊️", category: "Stationery", stock: 100 },
  ];

  let cart = []; // array of { ...product, qty }
  let currentCategory = "All";
  let orderCounter = 1001;

  const productGrid = document.getElementById('productGrid');
  const cartItemsEl = document.getElementById('cartItems');
  const categoryTabs = document.querySelectorAll('.cat-tab');
  const searchInput = document.getElementById('searchInput');

  // ===== RENDER PRODUCTS =====
  function renderProducts(){
    const searchTerm = searchInput.value.trim().toLowerCase();
    const filtered = products.filter(p => {
      const matchCat = currentCategory === "All" || p.category === currentCategory;
      const matchSearch = p.name.toLowerCase().includes(searchTerm);
      return matchCat && matchSearch;
    });

    productGrid.innerHTML = "";
    if (filtered.length === 0){
      productGrid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#9a92ac; padding:30px;">No products found.</p>`;
      return;
    }

    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = "product-card";
      card.innerHTML = `
        <div class="stock-badge">${p.stock} Left</div>
        <div class="product-emoji">${p.emoji}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-price">₹${p.price}</div>
        <button class="add-btn">+ Add to Cart</button>
      `;
      card.querySelector('.add-btn').addEventListener('click', () => addToCart(p.id));
      productGrid.appendChild(card);
    });
  }

  categoryTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      categoryTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.cat;
      renderProducts();
    });
  });

  searchInput.addEventListener('input', renderProducts);

  // ===== CART FUNCTIONS =====
  function addToCart(productId){
    const product = products.find(p => p.id === productId);
    const existing = cart.find(item => item.id === productId);
    if (existing){
      existing.qty += 1;
    } else {
      cart.push({ ...product, qty: 1 });
    }
    renderCart();
  }

  function changeQty(productId, delta){
    const item = cart.find(i => i.id === productId);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0){
      cart = cart.filter(i => i.id !== productId);
    }
    renderCart();
  }

  function removeItem(productId){
    cart = cart.filter(i => i.id !== productId);
    renderCart();
  }

  // ===== DISCOUNT LOGIC =====
  function getDiscountRate(subtotal){
    if (subtotal >= 2000) return 0.10;
    if (subtotal >= 1000) return 0.05;
    return 0;
  }

  const TAX_RATE = 0.05;

  function calculateBill(){
    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    const discountRate = getDiscountRate(subtotal);
    const discount = Math.round(subtotal * discountRate);
    const taxableAmount = subtotal - discount;
    const tax = Math.round(taxableAmount * TAX_RATE);
    const total = taxableAmount + tax;
    const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);

    return { subtotal, discountRate, discount, tax, total, totalItems };
  }

  function renderCart(){
    cartItemsEl.innerHTML = "";

    if (cart.length === 0){
      cartItemsEl.innerHTML = `
        <div class="empty-cart">
          <div>🛒</div>
          <p>Your cart is empty. Add some SIMATS merch!</p>
        </div>`;
    } else {
      cart.forEach(item => {
        const div = document.createElement('div');
        div.className = "cart-item";
        div.innerHTML = `
          <div class="emoji-sm">${item.emoji}</div>
          <div class="cart-item-info">
            <div class="name">${item.name}</div>
            <div class="price">₹${item.price} × ${item.qty}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-minus">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-plus">+</button>
          </div>
          <button class="remove-btn">🗑</button>
        `;
        div.querySelector('.qty-minus').addEventListener('click', () => changeQty(item.id, -1));
        div.querySelector('.qty-plus').addEventListener('click', () => changeQty(item.id, 1));
        div.querySelector('.remove-btn').addEventListener('click', () => removeItem(item.id));
        cartItemsEl.appendChild(div);
      });
    }

    const bill = calculateBill();
    document.getElementById('totalItemsCount').textContent = bill.totalItems;
    document.getElementById('subtotalVal').textContent = `₹${bill.subtotal.toLocaleString('en-IN')}`;
    document.getElementById('discountVal').textContent = `−₹${bill.discount.toLocaleString('en-IN')}`;
    document.getElementById('taxVal').textContent = `+₹${bill.tax.toLocaleString('en-IN')}`;
    document.getElementById('totalVal').textContent = `₹${bill.total.toLocaleString('en-IN')}`;

    const discountTag = document.getElementById('discountTag');
    if (bill.discountRate > 0){
      discountTag.style.display = "inline-block";
      discountTag.textContent = `${bill.discountRate * 100}% OFF`;
    } else {
      discountTag.style.display = "none";
    }

    document.getElementById('generateBillBtn').disabled = cart.length === 0;
  }

  // ===== GENERATE BILL =====
  document.getElementById('generateBillBtn').addEventListener('click', () => {
    const bill = calculateBill();
    const orderId = `SC-${orderCounter}`;
    document.getElementById('modalOrderNo').textContent = orderId;

    const receiptLines = document.getElementById('receiptLines');
    receiptLines.innerHTML = "";
    cart.forEach(item => {
      const line = document.createElement('div');
      line.innerHTML = `<span>${item.name} × ${item.qty}</span><span>₹${item.price * item.qty}</span>`;
      receiptLines.appendChild(line);
    });
    const subLine = document.createElement('div');
    subLine.innerHTML = `<span>Subtotal</span><span>₹${bill.subtotal}</span>`;
    receiptLines.appendChild(subLine);
    const discLine = document.createElement('div');
    discLine.innerHTML = `<span>Discount (${bill.discountRate*100}%)</span><span>−₹${bill.discount}</span>`;
    receiptLines.appendChild(discLine);
    const taxLine = document.createElement('div');
    taxLine.innerHTML = `<span>Tax (5%)</span><span>+₹${bill.tax}</span>`;
    receiptLines.appendChild(taxLine);

    document.getElementById('modalTotal').textContent = `₹${bill.total.toLocaleString('en-IN')}`;
    document.getElementById('billModal').classList.add('active');
  });

  document.getElementById('closeModalBtn').addEventListener('click', () => {
    document.getElementById('billModal').classList.remove('active');
    cart = [];
    orderCounter++;
    document.getElementById('orderNo').textContent = `SC-${orderCounter}`;
    renderCart();
  });

  // ===== INIT =====
  renderProducts();
  renderCart();
  document.getElementById('orderNo').textContent = `SC-${orderCounter}`;
</script>

</body>
</html>
