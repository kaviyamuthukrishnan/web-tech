<!DOCTYPE html>
<html lang="en">
<head>

<title>Registration - Sri Vidya College of Engineering</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Sri Vidya College of Engineering</h1>
    <nav>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="registration.html" class="active">Registration</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h2>Student Registration</h2>
        <p>Fill out the form below to register your interest in joining our college.</p>
        <form action="#" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" required>

            <label for="course">Preferred Course</label>
            <select id="course" name="course">
                <option value="it">Information Technology</option>
                <option value="cse">Computer Science Engineering</option>
                <option value="ece">Electronics and Communication</option>
                <option value="eee">Electrical and Electronics</option>
                <option value="mech">Mechanical Engineering</option>
            </select>

            <label for="message">Message (optional)</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <input type="submit" value="Submit Registration">
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Sri Vidya College of Engineering | Web Technology Lab Exercise</p>
</footer>

</body>
</html>
