<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMATS University – Student Result Processing Portal</title>
<style>
  :root{
    --purple:#6C3CE9;
    --pink:#FF3E9A;
    --teal:#1FC8C1;
    --yellow:#FFC93C;
    --dark:#1B1330;
    --bg:#F6F4FF;
    --card-bg:#ffffff;
    --radius:18px;
    --shadow:0 14px 34px rgba(108,60,233,0.16);
  }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI','Trebuchet MS',sans-serif; }
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 10% 10%, rgba(255,201,60,0.16), transparent 35%),
      radial-gradient(circle at 90% 20%, rgba(31,200,193,0.18), transparent 40%),
      var(--bg);
    color:var(--dark);
    display:flex; align-items:center; justify-content:center; padding:30px 16px;
  }
  .card{
    background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:40px 36px; max-width:520px; width:100%;
  }
  .top-tag{
    text-align:center; letter-spacing:3px; font-size:0.8rem; font-weight:700; color:var(--purple);
    margin-bottom:4px;
  }
  h1{
    text-align:center; font-size:1.5rem; font-weight:800; margin-bottom:6px;
    background:linear-gradient(90deg,var(--purple),var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{ text-align:center; color:#8b83a0; font-size:0.9rem; margin-bottom:28px; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.85rem; font-weight:700; margin-bottom:6px; color:var(--dark); }
  .field input{
    width:100%; padding:12px 16px; border:2px solid #ECE7FA; border-radius:10px; font-size:0.95rem;
    transition:border .2s;
  }
  .field input:focus{ outline:none; border-color:var(--purple); }

  .marks-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }

  .btn-row{ display:flex; gap:14px; margin-top:10px; }
  .btn{
    flex:1; padding:13px; border:none; border-radius:30px; font-weight:700; font-size:0.95rem; cursor:pointer;
    transition:transform .2s;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn-submit{
    background:linear-gradient(90deg,var(--purple),var(--pink)); color:#fff;
    box-shadow:0 10px 22px rgba(108,60,233,0.35);
  }
  .btn-reset{ background:#F1ECFF; color:var(--purple); }

  footer{ text-align:center; margin-top:22px; color:#9a92ac; font-size:0.8rem; }
  footer strong{ color:var(--purple); }

  @media (max-width:480px){
    .marks-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="top-tag">SIMATS UNIVERSITY</div>
  <h1>Student Result Processing Portal</h1>
  <p class="subtitle">Faculty Entry — enter student details to generate the result card</p>

  <!--
    IMPORTANT:
    method="post" sends data as an HTTP POST request.
    action="StudentResultServlet" maps to whatever URL pattern
    the servlet is registered under (see web.xml / @WebServlet).
  -->
  <form action="StudentResultServlet" method="post">

    <div class="field">
      <label for="name">Student Name</label>
      <input type="text" id="name" name="name" placeholder="e.g. Kaviya Muthukrishnan">
    </div>

    <div class="field">
      <label for="regNo">Register Number</label>
      <input type="text" id="regNo" name="regNo" placeholder="e.g. 24IT101">
    </div>

    <div class="field">
      <label>Marks (out of 100)</label>
      <div class="marks-row">
        <input type="number" name="mark1" placeholder="Web Technology" min="0" max="100">
        <input type="number" name="mark2" placeholder="Java" min="0" max="100">
        <input type="number" name="mark3" placeholder="Database" min="0" max="100">
      </div>
    </div>

    <div class="btn-row">
      <button type="reset" class="btn btn-reset">Reset</button>
      <button type="submit" class="btn btn-submit">Generate Result</button>
    </div>
  </form>

  <footer>Faculty Portal — built by <strong>Kaviya Muthukrishnan</strong> — SIMATS University</footer>
</div>

</body>
</html>
